[package]
name = "app"
version = "0.1.0"
description = "WinPet × Blobatar — floating desktop pet"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
sysinfo = { version = "0.32", features = ["network", "disk"] }
tauri-plugin-global-shortcut = "2.3.2"
